<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FitHub OS — Multi-Gym Management SaaS Demo Login & Quick Role Switcher">
  <title>Sign In — FitHub OS</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="login-card fade-in">
      <div class="login-logo">
        <div class="brand-logo">F</div>
        <h1>Fit<span>Hub</span> OS</h1>
        <p>Enterprise Multi-Gym Management Platform</p>
      </div>

      <!-- Sign In Form -->
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" class="form-control border-start-0 ps-0" id="loginEmail" placeholder="admin@fithubos.com" value="admin@fithubos.com" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label mb-0" for="loginPassword">Password</label>
            <span class="small text-muted" style="font-size:11px">Default: admin123</span>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" class="form-control border-start-0 ps-0" id="loginPassword" value="admin123" required>
            <button type="button" class="btn btn-outline-secondary border-start-0" id="togglePassword" title="Show/Hide Password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small text-muted" for="rememberMe">Remember session</label>
          </div>
          <a href="#" onclick="alert('For this browser-only demo, use any of the 1-Click Role demo accounts below.');return false;" class="small text-decoration-none">Help?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Workspace
        </button>
      </form>

      <!-- Quick 1-Click Role Switcher Demo -->
      <div class="position-relative my-4 text-center">
        <hr class="text-muted">
        <span class="position-absolute top-50 start-50 translate-middle px-3 bg-white text-muted small fw-semibold text-uppercase" style="font-size:11px;letter-spacing:0.5px">
          Or 1-Click Demo Login
        </span>
      </div>

      <div class="d-grid gap-2 mb-4" id="demoRolesList">
        <button class="demo-role-btn" onclick="demoLogin('super_admin')">
          <div class="role-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-shield-check"></i></div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between">
              <span class="role-name">Super Admin</span>
              <span class="badge bg-primary">Full Access</span>
            </div>
            <div class="role-desc">admin@fithubos.com · Platform oversight</div>
          </div>
        </button>

        <button class="demo-role-btn" onclick="demoLogin('gym_owner')">
          <div class="role-icon bg-success bg-opacity-10 text-success"><i class="bi bi-briefcase"></i></div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between">
              <span class="role-name">Gym Owner</span>
              <span class="badge bg-success">FitZone Club</span>
            </div>
            <div class="role-desc">owner@fitzone.in · Multi-branch finances</div>
          </div>
        </button>

        <button class="demo-role-btn" onclick="demoLogin('branch_manager')">
          <div class="role-icon bg-info bg-opacity-10 text-info"><i class="bi bi-building"></i></div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between">
              <span class="role-name">Branch Manager</span>
              <span class="badge bg-info text-dark">Andheri West</span>
            </div>
            <div class="role-desc">manager@fitzone.in · Operations & intake</div>
          </div>
        </button>

        <button class="demo-role-btn" onclick="demoLogin('trainer')">
          <div class="role-icon bg-warning bg-opacity-10 text-warning"><i class="bi bi-person-badge"></i></div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between">
              <span class="role-name">Fitness Trainer</span>
              <span class="badge bg-warning text-dark">Coaching</span>
            </div>
            <div class="role-desc">trainer@fitzone.in · Workouts & clients</div>
          </div>
        </button>

        <button class="demo-role-btn" onclick="demoLogin('staff')">
          <div class="role-icon bg-secondary bg-opacity-10 text-secondary"><i class="bi bi-headset"></i></div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between">
              <span class="role-name">Front-Desk Staff</span>
              <span class="badge bg-secondary">Reception</span>
            </div>
            <div class="role-desc">staff@fitzone.in · Check-ins & inquiries</div>
          </div>
        </button>

        <button class="demo-role-btn" onclick="demoLogin('member')">
          <div class="role-icon bg-danger bg-opacity-10 text-danger"><i class="bi bi-person"></i></div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between">
              <span class="role-name">Club Member</span>
              <span class="badge bg-danger">Member Portal</span>
            </div>
            <div class="role-desc">member@fitzone.in · Workouts & attendance</div>
          </div>
        </button>
      </div>

      <div class="disclaimer-banner">
        <i class="bi bi-info-circle-fill"></i>
        <div>
          <strong>Frontend Architecture:</strong> All seed records (500+ items across 26 collections) are persistently stored client-side in browser <code>LocalStorage</code>. No external database or server is required.
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/navigation.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Auto redirect if already signed in
    if (Auth.isLoggedIn()) {
      window.location.href = Navigation.getUrl('dashboard');
    }

    // Toggle password visibility
    document.getElementById('togglePassword')?.addEventListener('click', function() {
      const pwd = document.getElementById('loginPassword');
      const icon = this.querySelector('i');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    // Form sign in
    document.getElementById('loginForm')?.addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const res = Auth.login(email, password);
      if (res.success) {
        Utils.showToast(`Welcome back, ${res.user.name}! Redirecting...`, 'success');
        setTimeout(() => {
          window.location.href = Navigation.getUrl('dashboard');
        }, 300);
      } else {
        Utils.showToast(res.message || 'Invalid credentials', 'danger');
      }
    });

    // 1-Click Demo Login handler
    function demoLogin(roleKey) {
      const res = Auth.loginAs(roleKey);
      if (res.success) {
        Utils.showToast(`Logged in as ${Permissions.getRoleLabel(roleKey)}. Launching workspace...`, 'success');
        setTimeout(() => {
          window.location.href = Navigation.getUrl('dashboard');
        }, 300);
      } else {
        Utils.showToast(res.message || 'Demo account error', 'danger');
      }
    }
  </script>
</body>
</html>
