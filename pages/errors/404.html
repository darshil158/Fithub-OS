<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FitHub OS — Page Not Found (404 Error)">
  <title>404 — Page Not Found · FitHub OS</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/responsive.css" rel="stylesheet">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1d23 0%, #2d323b 50%, #1a1d23 100%);
      padding: 24px;
      color: #ffffff;
    }
    .error-card {
      max-width: 520px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .error-code {
      font-size: 84px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #6C5CE7, #A29BFE);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }
    .error-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .error-desc {
      color: #a0aec0;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-card fade-in">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">The requested resource or workout station does not exist or has been relocated within the FitHub OS platform architecture.</p>
      
      <div class="d-flex flex-wrap gap-2 justify-content-center">
        <a href="../dashboard/dashboard.html" class="btn btn-primary px-4 py-2"><i class="bi bi-speedometer2 me-2"></i>Return to Dashboard</a>
        <a href="../../login.html" class="btn btn-outline-light px-4 py-2"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</a>
      </div>

      <div class="quick-links">
        <a href="../people/members.html" class="badge bg-secondary text-decoration-none py-2 px-3"><i class="bi bi-people me-1"></i>Members</a>
        <a href="../finance/payments.html" class="badge bg-secondary text-decoration-none py-2 px-3"><i class="bi bi-credit-card me-1"></i>Payments</a>
        <a href="../operations/classes.html" class="badge bg-secondary text-decoration-none py-2 px-3"><i class="bi bi-easel me-1"></i>Classes</a>
        <a href="../organization/settings.html" class="badge bg-secondary text-decoration-none py-2 px-3"><i class="bi bi-gear me-1"></i>Settings</a>
      </div>
    </div>
  </div>
</body>
</html>
